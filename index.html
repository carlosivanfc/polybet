<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<style>
:root{
  --bg:#05050f; --nav:#05050f; --surface:#0d0d1f; --surface2:#131330; --line:rgba(255,255,255,.08);
  --text:#f4f4fb; --muted:#9a9ab8; --purple:#8b5cf6; --purple2:#7c3aed; --purple-soft:rgba(139,92,246,.16);
  --yes:#34d399; --yes-bg:rgba(16,185,129,.16); --yes-line:rgba(52,211,153,.35);
  --no:#fb4f86; --no-bg:rgba(244,63,94,.15); --no-line:rgba(251,79,134,.35);
  --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
a{color:var(--purple);text-decoration:none} a:hover{text-decoration:underline}
.mono{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;height:68px;padding:0 24px;background:rgba(5,5,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{height:32px;display:block}
nav.tabs{display:flex;gap:6px}
nav.tabs button{padding:9px 18px;border-radius:999px;color:var(--muted);font-weight:600}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.on{background:var(--purple-soft);color:var(--text);box-shadow:inset 0 -2px 0 var(--purple)}
.search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;height:42px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.search svg{flex:none;opacity:.6}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search input::placeholder{color:#6f6f90}
.net{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#6f6f90}
.dot.ok{background:var(--yes);box-shadow:0 0 8px var(--yes)} .dot.bad{background:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:12px;font-weight:700;transition:.15s}
.btn.primary{background:var(--purple2);color:#fff;box-shadow:0 6px 24px rgba(124,58,237,.35)}
.btn.primary:hover{background:#8b4cf7}
.btn.ghost{border:1px solid rgba(255,255,255,.28)} .btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}

/* layout */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;gap:24px;max-width:1500px;margin:0 auto;padding:24px}
aside.side{position:sticky;top:92px;align-self:start;height:calc(100vh - 116px);display:flex;flex-direction:column}
.side h6{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6f6f90;margin:18px 12px 8px}
.side h6:first-child{margin-top:0}
.side button.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;color:#cfcfe6;font-weight:500;text-align:left}
.side button.item:hover{background:var(--surface)}
.side button.item.on{background:var(--purple-soft);color:#fff}
.side button.item .n{margin-left:auto;font-size:12px;color:var(--muted)}
.side .spacer{flex:1}
.side .btn{width:100%;height:48px}
.col{min-width:0;display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:36px;background:radial-gradient(120% 140% at 85% 100%,rgba(124,58,237,.55),rgba(13,13,31,0) 60%),var(--surface);border:1px solid var(--line);min-height:230px}
.hero h1{font-size:46px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--purple)}
.hero p{margin-top:12px;color:#c9c9e2;max-width:430px;font-size:17px}
.hero .cta{display:flex;gap:12px;margin-top:24px;position:relative;z-index:1}
.hero svg.swoosh{position:absolute;right:0;bottom:0;width:62%;height:90%;pointer-events:none}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between}
.sectionhead h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.sectionhead .hint{color:var(--muted);font-size:13px}

/* market cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.15s}
.mcard:hover{border-color:rgba(139,92,246,.55);transform:translateY(-2px)}
.mtop{display:flex;gap:14px}
.mico{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#6d28d9,#3b0a9a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.mq{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.mmeta{display:flex;gap:10px;align-items:center;margin-top:6px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.badge{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.badge.open{background:var(--purple-soft);color:#c4b0ff}
.badge.yes{background:var(--yes-bg);color:var(--yes)} .badge.no{background:var(--no-bg);color:var(--no)}
.badge.pending{background:rgba(251,191,36,.14);color:var(--warn)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side-btn{height:44px;border-radius:10px;font-weight:700;border:1px solid transparent;transition:.12s}
.side-btn.yes{background:var(--yes-bg);color:var(--yes)} .side-btn.yes:hover,.side-btn.yes.on{border-color:var(--yes-line);background:rgba(16,185,129,.26)}
.side-btn.no{background:var(--no-bg);color:var(--no)} .side-btn.no:hover,.side-btn.no.on{border-color:var(--no-line);background:rgba(244,63,94,.26)}
.mfoot{color:var(--muted);font-size:13px;display:flex;justify-content:space-between}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

/* right column */
.pv{font-size:34px;font-weight:800;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;padding-top:16px;border-top:1px solid var(--line)}
.kv small{display:block;color:var(--muted);font-size:12.5px}
.kv b{font-size:18px}
.pos{color:var(--yes)} .neg{color:var(--no)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card h3{font-size:19px;font-weight:800;margin-bottom:10px}
.trend{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.trend:first-of-type{border-top:0}
.trend .ti{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#6d28d9,#3b0a9a)}
.trend .tq{flex:1;min-width:0;font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.trend .tv{font-weight:700;font-size:13.5px;white-space:nowrap}
.addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#cfcfe6;word-break:break-all}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6f6f90;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(255,255,255,.025)}
.tablewrap{overflow-x:auto}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,2,10,.72);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{width:100%;max-width:640px;background:var(--surface);border:1px solid rgba(139,92,246,.35);border-radius:22px;padding:28px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal .x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.modal h2{font-size:24px;font-weight:800;line-height:1.2;padding-right:40px;overflow-wrap:anywhere}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface2);margin:18px 0 8px}
.bar i{display:block;transition:width .4s}
.bar .y{background:linear-gradient(90deg,#10b981,#34d399)} .bar .n{background:linear-gradient(90deg,#fb4f86,#f43f5e)}
.barlab{display:flex;justify-content:space-between;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--surface2);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font-size:16px}
.field{margin-top:16px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.input{width:100%;height:48px;padding:0 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;outline:0;font-size:16px}
.input:focus{border-color:var(--purple)}
.chips{display:flex;gap:8px;margin-top:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface2);font-size:13px;color:#cfcfe6}
.chip:hover{background:var(--purple-soft)}
.est{margin-top:16px;padding:14px;border-radius:12px;background:var(--surface2);display:grid;gap:8px;font-size:14px}
.est div{display:flex;justify-content:space-between;gap:12px}
.est span:first-child{color:var(--muted)}
.banner{margin-top:18px;padding:14px 16px;border-radius:12px;font-weight:600}
.banner.yes{background:var(--yes-bg);color:var(--yes)} .banner.no{background:var(--no-bg);color:var(--no)}
.banner.info{background:var(--purple-soft);color:#c4b0ff}
.creatorbox{margin-top:20px;padding:16px;border:1px dashed rgba(251,191,36,.5);border-radius:14px}
.creatorbox p{font-size:13.5px;color:#e8d9a8;margin-bottom:12px}
.note{color:var(--muted);font-size:12.5px;margin-top:12px}

/* toasts */
#toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 40px))}
.toast{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--purple);border-radius:12px;padding:14px 16px;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.ok{border-left-color:var(--yes)} .toast.err{border-left-color:var(--no)}
.toast b{display:block;margin-bottom:2px}
.toast .small{font-size:12.5px;color:var(--muted);word-break:break-all}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
footer{max-width:1500px;margin:0 auto;padding:8px 24px 40px;color:var(--muted);font-size:12.5px;display:flex;gap:18px;flex-wrap:wrap}

@media (max-width:1180px){
  .shell{grid-template-columns:1fr}
  aside.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:6px}
  .side h6,.side .spacer{display:none}
  .side button.item{width:auto}
  .side .btn{width:auto}
  header .search{display:none}
}
@media (max-width:700px){
  .grid{grid-template-columns:1fr} .hero h1{font-size:34px} .stats{grid-template-columns:1fr}
  nav.tabs button{padding:8px 6px;font-size:12.5px} header{gap:8px;padding:0 12px} .net{display:none} .logo{height:24px} header .btn{padding:0 12px;font-size:13px;height:38px} nav.tabs{gap:0}
}

/* ===== motion & polish ===== */
.hero{isolation:isolate}
.hero .orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;z-index:-1;pointer-events:none;will-change:transform}
.hero .o1{width:240px;height:240px;right:8%;top:-70px;background:#7c3aed;animation:float1 9s ease-in-out infinite}
.hero .o2{width:200px;height:200px;right:34%;bottom:-90px;background:#2563eb;opacity:.35;animation:float2 11s ease-in-out infinite}
.hero .o3{width:140px;height:140px;left:-40px;top:30%;background:#c026d3;opacity:.25;animation:float1 13s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(calc(var(--mx,0)*18px),calc(var(--my,0)*12px))}50%{transform:translate(calc(var(--mx,0)*18px + 22px),calc(var(--my,0)*12px - 26px))}}
@keyframes float2{0%,100%{transform:translate(calc(var(--mx,0)*-14px),0)}50%{transform:translate(calc(var(--mx,0)*-14px - 30px),-20px)}}
.hero h1 .rot{display:inline-block;transition:opacity .35s,transform .35s;background:linear-gradient(90deg,#a78bfa,#f0abfc,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .rot.out{opacity:0;transform:translateY(10px)}
.hero .live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c4b0ff;background:rgba(124,58,237,.18);border:1px solid rgba(139,92,246,.4);padding:5px 12px;border-radius:999px;margin-bottom:16px}
.pulse{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.hero svg.swoosh path.line{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s .2s ease-out forwards}
.hero.seen svg.swoosh path.line{animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.hero svg.swoosh circle.tip{animation:tip 1.8s infinite}
@keyframes tip{0%,100%{r:6;opacity:1}50%{r:11;opacity:.35}}
.hero .cta .btn.primary{position:relative;overflow:hidden;animation:glow 2.6s ease-in-out infinite}
.hero .cta .btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.6s infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.0)}50%{box-shadow:0 0 26px 2px rgba(124,58,237,.65)}}
.hstats{display:flex;gap:28px;margin-top:26px;position:relative;z-index:1;flex-wrap:wrap}
.hstats div small{display:block;color:#a9a9c8;font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.hstats div b{font-size:24px;font-weight:800}
.hot{display:flex;align-items:center;gap:14px;margin-top:22px;padding:12px 14px;border-radius:14px;background:rgba(13,13,31,.55);border:1px solid rgba(139,92,246,.35);backdrop-filter:blur(6px);position:relative;z-index:1;max-width:560px;cursor:pointer;transition:.15s}
.hot:hover{border-color:var(--purple);transform:translateY(-1px)}
.hot .hq{flex:1;min-width:0;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.hot .hq small{display:block;color:#fb923c;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.hot .mini{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:8px;background:var(--surface2)}
.hot .mini i:first-child{background:linear-gradient(90deg,#10b981,#34d399)} .hot .mini i:last-child{background:#f43f5e}
.hot .go{font-weight:800;color:#c4b0ff;white-space:nowrap}
.ticker{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 0;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .track{display:inline-flex;gap:38px;white-space:nowrap;animation:scroll 38s linear infinite;padding-left:38px}
.ticker:hover .track{animation-play-state:paused}
.ticker span.ev{font-size:13.5px;color:#cfcfe6}
.ticker span.ev b.y{color:var(--yes)} .ticker span.ev b.n{color:var(--no)}
@keyframes scroll{to{transform:translateX(-50%)}}
.mcard{position:relative;overflow:hidden}
.mcard.enter{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.mcard::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 120px at var(--cx,50%) -20%,rgba(139,92,246,.22),transparent);opacity:0;transition:.2s;pointer-events:none}
.mcard:hover::before{opacity:1}
.mcard:hover{box-shadow:0 14px 40px rgba(76,29,149,.35)}
.oddsbar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.oddsbar i{display:block;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.oddsbar i.y{background:linear-gradient(90deg,#10b981,#34d399)} .oddsbar i.n{background:linear-gradient(90deg,#fb4f86,#f43f5e)}
.side-btn:active,.btn:active{transform:scale(.97)}
.hotbadge{background:rgba(251,146,60,.16);color:#fb923c}
.hotbadge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fb923c;margin-right:6px;animation:pulse 1.8s infinite}
/* settled / past */
.mcard.done{background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(255,255,255,0)),var(--surface);border-style:dashed}
.mcard.done .mico{filter:grayscale(.7);opacity:.75}
.mcard.done .mq{color:#b9b9d6}
.mcard .result{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13.5px}
.mcard .result.yes{background:var(--yes-bg);color:var(--yes)} .mcard .result.no{background:var(--no-bg);color:var(--no)}
.mcard .result.mine-won{box-shadow:inset 0 0 0 1px var(--yes-line)}
tr.past td{opacity:.55} tr.past td:last-child,tr.past td:nth-child(2){opacity:.9}
tr.past .addr{opacity:.8}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--purple);color:#fff}
.chipres{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.chipres.w{background:var(--yes-bg);color:var(--yes)} .chipres.l{background:var(--no-bg);color:var(--no)} .chipres.s{background:var(--purple-soft);color:#c4b0ff}
tr.newrow{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:rgba(139,92,246,.35)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero svg.swoosh path.line{stroke-dashoffset:0}}
@media (max-width:700px){.hstats{gap:18px}.hstats div b{font-size:20px}.hot{flex-wrap:wrap}}
</style>
</head>

<script>
/* ============ CONFIG ============ */
const CFG = {
  address: "0x5CFDd5b35F1FE9251D836848FFd01DabBea1B02D",   // Polybet contract on Sepolia
  chainId: 11155111,
  chainHex: "0xaa36a7",
  rpcs: ["https://ethereum-sepolia-rpc.publicnode.com", "https://sepolia.drpc.org", "https://sepolia.gateway.tenderly.co", "https://1rpc.io/sepolia", "https://rpc.sepolia.org"],
  explorer: "https://sepolia.etherscan.io",
  faucet: "https://cloud.google.com/application/web3/faucet/ethereum/sepolia",
  deployBlock: 12051203,          // block where Polybet was deployed (Activity starts here)
  feeBps: 300                     // 2% platform + 1% creator
};
const params = new URLSearchParams(location.search);
if (params.get("contract")) CFG.address = params.get("contract");
if (params.get("rpc")) CFG.rpcs = [params.get("rpc")];
if (params.get("from")) CFG.deployBlock = Number(params.get("from"));

const TEAM = {
  "0x724710d85545f80b597b6cb53973bbf190ec2b0d": "Carlos",
  "0x3475942bc48f5bc545fb422131b51acb926a0418": "Farah",
  "0xa69b0f1a4b478d85c5800be9eb4d71bec45ccbd2": "Chelsie",
  "0xa50f36d27edec94c49eedd2a932c3c9598a21813": "David",
  "0xc1b73bd67a9af3547a95e6f9cfceba9752a33b4e": "Ginevra"
};
const ABI = [
  "function marketCount() view returns (uint256)",
  "function markets(uint256) view returns (string question,address creator,bool resolved,bool yesWins,uint256 yesPool,uint256 noPool,uint256 payoutPool)",
  "function yesBets(uint256,address) view returns (uint256)",
  "function noBets(uint256,address) view returns (uint256)",
  "function claimed(uint256,address) view returns (bool)",
  "function feesOwed(address) view returns (uint256)",
  "function createMarket(string question) returns (uint256 id)",
  "function bet(uint256 id,bool yes) payable",
  "function resolve(uint256 id,bool yesWins)",
  "function claim(uint256 id)",
  "function withdrawFees()",
  "event MarketCreated(uint256 indexed id,address indexed creator,string question)",
  "event BetPlaced(uint256 indexed id,address indexed bettor,bool yes,uint256 amount)",
  "event MarketResolved(uint256 indexed id,bool yesWins)",
  "event WinningsClaimed(uint256 indexed id,address indexed bettor,uint256 amount)"
];

/* ============ STATE ============ */
const S = {
  tab: "markets", filter: "all", query: "",
  markets: [], activity: [], feesOwed: 0n,
  account: null, chainOk: false, balance: null,
  reader: null, readContract: null, browserProvider: null, signer: null, writeContract: null,
  modalId: null, activityError: null, actMap: new Map(), actScanned: null, actBusy: null, actFilter: 'all', rpcIdx: 0, sig: '', animated: false, shown: {}, side: true, amount: "0.002", loading: true, loadError: null
};

/* ============ HELPERS ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = a => a ? a.slice(0,6) + "…" + a.slice(-4) : "";
const who = a => { const n = a && TEAM[a.toLowerCase()]; return n ? `${n} · ${short(a)}` : short(a); };
const eth = (wei, d=4) => {
  const v = Number(ethers.formatEther(wei));
  if (v === 0) return "0";
  if (v < 0.0001) return "<0.0001";
  return v.toLocaleString("en-US", {maximumFractionDigits: d});
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const same = (a,b) => a && b && a.toLowerCase() === b.toLowerCase();
const total = m => m.yesPool + m.noPool;
const pct = (m, yes) => { const t = total(m); if (t === 0n) return 50; const p = Number((yes ? m.yesPool : m.noPool) * 10000n / t) / 100; return p; };
const fmtPct = p => (Math.round(p) === p ? p : p.toFixed(1)) + "%";
const IC_CHART = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>';

function toast(title, body="", kind="", sticky=false){
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<b>${title}</b><div class="small">${body}</div>`;
  $("#toasts").appendChild(el);
  if (!sticky) setTimeout(() => el.remove(), kind === "err" ? 9000 : 6500);
  return { el, update(t,b,k){ el.className = "toast " + (k||""); el.innerHTML = `<b>${t}</b><div class="small">${b||""}</div>`; if(k) setTimeout(() => el.remove(), 9000); }, remove(){ el.remove(); } };
}
function errMsg(e){
  const m = e?.shortMessage || e?.reason || e?.info?.error?.message || e?.message || String(e);
  if (e?.code === "ACTION_REJECTED" || /user rejected/i.test(m)) return "Transaction rejected in wallet.";
  if (/insufficient funds/i.test(m)) return "Not enough Sepolia ETH in this wallet to cover the bet plus gas.";
  const rev = m.match(/reverted with reason string '([^']+)'/); if (rev) return rev[1];
  return m.length > 220 ? m.slice(0, 220) + "…" : m;
}

/* ============ CHAIN: READ ============ */
function mkReader(i){
  // the connected wallet's own node (MetaMask/Infura) is the last fallback
  const useWallet = !!(eth_() && S.account && !params.get("rpc"));
  const n = CFG.rpcs.length + (useWallet ? 1 : 0);
  i = ((i % n) + n) % n;
  let p;
  if (i < CFG.rpcs.length){
    const fr = new ethers.FetchRequest(CFG.rpcs[i]);
    fr.timeout = 9000;                    // never hang: fail fast and rotate
    fr.retryFunc = async () => false;     // no hidden long 429 back-off
    p = new ethers.JsonRpcProvider(fr, CFG.chainId, { staticNetwork: true, batchMaxCount: 1 });
  }else{
    p = new ethers.BrowserProvider(eth_(), CFG.chainId);
  }
  S.rpcIdx = i; S.reader = p; S.readContract = new ethers.Contract(CFG.address, ABI, p);
  return p;
}
async function initReader(){
  for (let i = 0; i < CFG.rpcs.length; i++){
    try{ const p = mkReader(i); await p.getBlockNumber(); return; }
    catch(e){ console.warn("RPC failed", CFG.rpcs[i], e); }
  }
  throw new Error("Could not reach any Sepolia RPC endpoint.");
}
// run a read; on failure switch to the next RPC and retry with a short backoff
async function robust(fn, tries = 5){
  let last;
  for (let a = 0; a < tries; a++){
    try{ return await fn(); }
    catch(e){ last = e; console.warn("read failed, switching RPC", e?.shortMessage || e?.message || e); mkReader((S.rpcIdx || 0) + 1); await sleep(400 * (a + 1)); }
  }
  throw last;
}

async function loadMarkets(){ return robust(loadMarketsOnce, 4); }
async function loadMarketsOnce(){
  const c = S.readContract;
  const n = Number(await c.marketCount());
  const ids = Array.from({length:n}, (_,i) => i);
  const acct = S.account;
  const list = await Promise.all(ids.map(async id => {
    const r = await c.markets(id);
    const m = { id, question: r.question, creator: r.creator, resolved: r.resolved, yesWins: r.yesWins, yesPool: r.yesPool, noPool: r.noPool, payoutPool: r.payoutPool, myYes: 0n, myNo: 0n, claimed: false };
    if (acct){
      [m.myYes, m.myNo, m.claimed] = await Promise.all([c.yesBets(id, acct), c.noBets(id, acct), c.claimed(id, acct)]);
    }
    return m;
  }));
  S.markets = list.reverse();   // newest first
  S.feesOwed = acct ? await c.feesOwed(acct) : 0n;
}

// getLogs over a block range, split into chunks; halves a chunk if the RPC rejects it
async function getLogsChunked(from, to, size, out, onChunk, deadline){
  let splits = 0;
  async function range(a, b){
    if (deadline && Date.now() > deadline) throw new Error("Timed out reading events. Check your connection and press Retry.");
    try { const res = await robust(() => S.reader.getLogs({ address: CFG.address, fromBlock: a, toBlock: b }), 4); out.push(...res); if (onChunk) onChunk(res); }
    catch(e){
      if (b - a < 200 || ++splits > 4) throw e;
      const mid = Math.floor((a + b) / 2);
      await range(a, mid); await range(mid + 1, b);
    }
  }
  for (let a = from; a <= to; a += size) await range(a, Math.min(a + size - 1, to));
  return out;
}
const ACT_KEY = "polybet_act_v2_" + CFG.address.toLowerCase();
function actLoadCache(){
  try{
    const c = JSON.parse(localStorage.getItem(ACT_KEY) || "null");
    if (c && c.rows){ S.actScanned = c.scanned; for (const r of c.rows){ if (r.amt != null) r.amt = BigInt(r.amt); S.actMap.set(r.tx + ":" + r.idx, r); } }
  }catch(e){}
}
function actSaveCache(){
  try{ localStorage.setItem(ACT_KEY, JSON.stringify({ scanned: S.actScanned, rows: [...S.actMap.values()].map(r => ({ ...r, amt: r.amt != null ? r.amt.toString() : null })) })); }catch(e){}
}
function actPublish(){
  S.activity = [...S.actMap.values()].sort((x, y) => y.block - x.block || y.idx - x.idx);
}

// incremental: only scans blocks we haven't seen; never wipes data we already have
function ingestLogs(logs){
  const iface = new ethers.Interface(ABI);
  for (const l of logs){
    let ev; try { ev = iface.parseLog(l); } catch(e){ continue; }
    const base = { block: l.blockNumber, idx: l.index, tx: l.transactionHash, id: Number(ev.args.id) };
    let row = null;
    if (ev.name === "MarketCreated") row = { ...base, t: "created", who: ev.args.creator };
    else if (ev.name === "BetPlaced") row = { ...base, t: ev.args.yes ? "bet-yes" : "bet-no", who: ev.args.bettor, amt: ev.args.amount };
    else if (ev.name === "MarketResolved") row = { ...base, t: ev.args.yesWins ? "res-yes" : "res-no" };
    else if (ev.name === "WinningsClaimed") row = { ...base, t: "claim", who: ev.args.bettor, amt: ev.args.amount };
    if (row) S.actMap.set(row.tx + ":" + row.idx, row);
  }
}
// incremental + progressive: shows rows as soon as each block range arrives; never wipes data we already have
async function loadActivity(){
  if (S.actBusy) return S.actBusy;
  const run = (async () => {
    try{
      const latest = await robust(() => S.reader.getBlockNumber());
      const first = Math.max(0, Math.min(CFG.deployBlock, latest));
      const from = S.actScanned != null && !params.get("from") ? Math.max(first, S.actScanned - 3) : first;
      const logs = [];
      await getLogsChunked(from, latest, 5000, logs, res => {
        ingestLogs(res); actPublish();
        if (S.tab === "activity" && S.activity.length) render();
      }, Date.now() + 60000);
      S.actScanned = latest; S.activityError = null;
      actPublish(); actSaveCache();
    }catch(e){
      console.warn("activity", e);
      S.activityError = S.activity.length ? null : errMsg(e);
    }finally{ if (S.actBusy === run) S.actBusy = null; }
  })();
  S.actBusy = run;
  return run;
}

function dataSig(){

async function refresh(withActivity=false, background=false){

    await loadMarkets();

    console.error(e);

    S.loadError = S.markets.length ? null : errMsg(e);

async function ensureSepolia(){

/* ============ TRANSACTIONS ============ */
async function sendTx(label, fn, afterOk){
  if (!(await needWallet())) return null;
  const t = toast(label, '<span class="spin"></span>Confirm in your wallet…', "", true);
  try{
    const tx = await fn(S.writeContract);
    t.update(label, `<span class="spin"></span>Waiting for confirmation…<br><a target="_blank" rel="noopener" href="${CFG.explorer}/tx/${tx.hash}">${short(tx.hash)} on Etherscan</a>`);
    const rc = await tx.wait();
    if (rc.status !== 1) throw new Error("Transaction failed on-chain.");
    const fee = rc.gasUsed * (rc.gasPrice ?? rc.effectiveGasPrice ?? 0n);
    t.update(label + " confirmed", `Gas used: ${rc.gasUsed.toString()} · fee ${ethers.formatEther(fee)} ETH<br><a target="_blank" rel="noopener" href="${CFG.explorer}/tx/${tx.hash}">View on Etherscan</a>`, "ok");
    if (afterOk) afterOk(rc);
    refresh(true); refreshSoon();
    return rc;
  }catch(e){
    t.update(label + " failed", esc(errMsg(e)), "err");
    return null;
  }
}


async function withGas(c, name, args, extra={}){
  let gasLimit;
  try { const g = await c[name].estimateGas(...args, extra); gasLimit = g * 16n / 10n; }
  catch(e){ console.warn("estimateGas failed", e); throw e; }
  return c[name](...args, { ...extra, gasLimit });
}

/* ============ PAYOUT MATHS (mirrors the contract) ============ */
function myWinning(m){ return m.yesWins ? m.myYes : m.myNo; }
function claimable(m){
  if (!m.resolved || m.claimed) return 0n;
  const winPool = m.yesWins ? m.yesPool : m.noPool;
  if (winPool === 0n) return m.myYes + m.myNo;
  const mine = myWinning(m);
  return mine === 0n ? 0n : mine * m.payoutPool / winPool;
}
function projected(m, yes, addWei){
  const mine = (yes ? m.myYes : m.myNo) + addWei;
  const t = total(m) + addWei;
  const winPool = (yes ? m.yesPool : m.noPool) + addWei;
  if (winPool === 0n) return 0n;
  const pool = t - t * 200n / 10000n - t * 100n / 10000n;
  return mine * pool / winPool;
}
function statusBadge(m){
  if (!m.resolved) return '<span class="badge open">Open</span>';
  return m.yesWins ? '<span class="badge yes">Resolved: YES</span>' : '<span class="badge no">Resolved: NO</span>';
}

      <td class="mono">${r.amt ? eth(r.amt) + " ETH" : ""}</td><td style="max-width:260px;overflow-wrap:anywhere">${nameOf(r.id)}</td>
      <td><a target="_blank" rel="noopener" href="${CFG.explorer}/tx/${r.tx}">${short(r.tx)}</a></td></tr>`).join("") || '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">Nothing here yet.</td></tr>'}
    </tbody></table></div></div>`;
}

function renderRight(){
  let staked = 0n, claimTotal = 0n;
  S.markets.forEach(m => { staked += m.myYes + m.myNo; claimTotal += claimable(m); });
  const pf = S.account ? `
    <div class="card">
      <div class="sectionhead"><h3 style="margin:0">My Portfolio</h3><span class="net" style="padding:4px 10px"><span class="dot ${S.chainOk?'ok':'bad'}"></span>${S.chainOk ? "Sepolia" : "Wrong network"}</span></div>
      <div class="addr" style="margin:10px 0 4px"><a target="_blank" rel="noopener" href="${CFG.explorer}/address/${S.account}">${short(S.account)}</a></div>
      <small style="color:var(--muted)">Wallet balance</small>
      <div class="pv mono">${S.balance != null ? eth(S.balance, 4) : "…"} <span style="font-size:16px;color:var(--muted)">ETH</span></div>
      <div class="kv"><div><small>Total staked</small><b class="mono">${eth(staked)} ETH</b></div><div><small>Claimable</small><b class="mono ${claimTotal > 0n ? 'pos' : ''}">${eth(claimTotal)} ETH</b></div></div>
      ${S.feesOwed > 0n ? `<button class="btn primary" style="width:100%;margin-bottom:10px" data-act="withdraw">Withdraw ${eth(S.feesOwed)} ETH fees</button>` : ""}
      <div class="row2"><a class="btn ghost" target="_blank" rel="noopener" href="${CFG.faucet}">Get test ETH</a><button class="btn ghost" data-tab-go="portfolio">Positions</button></div>
    </div>` : `
    <div class="card">
      <h3>My Portfolio</h3>
      <p style="color:var(--muted);margin-bottom:16px">Connect a wallet on Sepolia to bet, resolve markets you created and claim winnings.</p>
      <button class="btn primary" style="width:100%" data-act="connect">Connect wallet</button>
      <p class="note">No wallet funds? Test ETH is free from the <a target="_blank" rel="noopener" href="${CFG.faucet}">Sepolia faucet</a>.</p>
    </div>`;
  const trending = [...S.markets].sort((a,b) => (total(b) > total(a)) ? 1 : -1).slice(0, 5);
  const tr = `<div class="card"><h3>Trending Markets</h3>${trending.length ? trending.map(m => `
    <div class="trend" data-open="${m.id}"><div class="ti"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7"/></svg></div>
    <div class="tq">${esc(m.question)}</div><div class="tv mono">${eth(total(m))} ETH</div></div>`).join("") : '<div class="note">Nothing yet.</div>'}</div>`;
  return pf + tr;
}

function render(){
  $("#main").innerHTML = renderMain();
  $("#right").innerHTML = renderRight();
  $("#connect").textContent = S.account ? short(S.account) : "Connect wallet";
  $("#connect").className = "btn " + (S.account ? "ghost" : "primary");
  const nd = $("#net .dot"); nd.className = "dot " + (S.account ? (S.chainOk ? "ok" : "bad") : "");
  $("#netlabel").textContent = S.account && !S.chainOk ? "Wrong network" : "Sepolia testnet";
  $("#contractLink").href = `${CFG.explorer}/address/${CFG.address}`;
  $("#n-all").textContent = S.markets.length || "";
  $("#n-open").textContent = S.markets.filter(m => !m.resolved).length || "";
  $("#n-resolved").textContent = S.markets.filter(m => m.resolved).length || "";
  $("#n-mine").textContent = S.markets.filter(m => same(m.creator, S.account)).length || "";
  $("#n-positions").textContent = S.markets.filter(m => m.myYes > 0n || m.myNo > 0n).length || "";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  document.querySelectorAll(".side .item").forEach(b => b.classList.toggle("on", S.tab === "markets" && b.dataset.filter === S.filter));
  if (S.modalId != null) renderModal();
  afterRender();
}
function afterRender(){
  // count-up numbers (from the last shown value)
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = Number(el.dataset.count), dec = Number(el.dataset.dec || 0), key = el.dataset.key;
    const from = S.counts && S.counts[key] != null ? S.counts[key] : 0;
    (S.counts = S.counts || {})[key] = to;
    if (from === to || matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = to.toFixed(dec); return; }
    const t0 = performance.now(), dur = 900;
    (function step(t){ const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = (from + (to - from) * e).toFixed(dec); if (k < 1) requestAnimationFrame(step); })(t0);
  });
  S.animated = true;
  if (S.tab === "activity"){ S.seenAct = new Set(S.activity.map(r => r.tx + ":" + r.idx)); }
}
const WORDS = ["future.", "outcome.", "odds.", "campus.", "next big thing."];
let wi = 0;
setInterval(() => { const el = document.getElementById("rot"); if (!el || document.hidden) return; el.classList.add("out"); setTimeout(() => { wi = (wi + 1) % WORDS.length; el.textContent = WORDS[wi]; el.classList.remove("out"); }, 350); }, 2600);
document.addEventListener("pointermove", e => { const h = document.getElementById("hero"); if (!h) return; const r = h.getBoundingClientRect(); h.style.setProperty("--mx", ((e.clientX - r.left) / r.width - .5).toFixed(2)); h.style.setProperty("--my", ((e.clientY - r.top) / r.height - .5).toFixed(2)); });
document.addEventListener("pointermove", e => { const c = e.target.closest && e.target.closest(".mcard"); if (c){ const r = c.getBoundingClientRect(); c.style.setProperty("--cx", (e.clientX - r.left) + "px"); } });

/* ============ MODALS ============ */
function openModal(html){ $("#modal").innerHTML = html; $("#overlay").classList.add("show"); }
function closeModal(){ $("#overlay").classList.remove("show"); S.modalId = null; S.modalKind = null; }

function marketModalHtml(m){
  const yp = pct(m, true), np = 100 - yp, t = total(m);
  const isCreator = same(m.creator, S.account);
  const cl = claimable(m);
  let result = "";
  if (m.resolved){
    result = `<div class="banner ${m.yesWins ? "yes" : "no"}">Resolved: ${m.yesWins ? "YES" : "NO"} won.
      ${(m.yesWins ? m.yesPool : m.noPool) === 0n ? " Nobody bet on the winning side, so everyone is refunded." : ""}</div>`;
    if (S.account){
      if (m.claimed) result += `<div class="banner info">You already claimed your payout for this market.</div>`;
      else if (cl > 0n) result += `<button class="btn primary" style="width:100%;margin-top:12px;height:50px" data-claim="${m.id}">Claim ${eth(cl, 6)} ETH</button>`;
      else if (m.myYes + m.myNo > 0n) result += `<div class="banner info">Your side lost this market. Nothing to claim.</div>`;
    }
  }
  let betForm = "";
  if (!m.resolved){
    let add = 0n; try { add = ethers.parseEther(S.amount || "0"); } catch(e){}
    const proj = add > 0n ? projected(m, S.side, add) : 0n;
    const mult = add > 0n && proj > 0n ? Number(proj * 1000n / add) / 1000 : 0;
    betForm = `
      <div class="field"><label>Pick a side</label><div class="sides">
        <button class="side-btn yes ${S.side ? "on" : ""}" data-pick="yes">Yes ${t === 0n ? "50%" : fmtPct(yp)}</button>
        <button class="side-btn no ${!S.side ? "on" : ""}" data-pick="no">No ${t === 0n ? "50%" : fmtPct(np)}</button></div></div>
      <div class="field"><label>Amount (Sepolia ETH)</label>
        <input class="input mono" id="amt" inputmode="decimal" value="${esc(S.amount)}" placeholder="0.002">
        <div class="chips">${["0.001","0.002","0.005","0.01"].map(v => `<button class="chip" data-amt="${v}">${v}</button>`).join("")}</div></div>
      <div class="est">
        <div><span>If ${S.side ? "YES" : "NO"} wins, your total payout</span><b class="mono">${add > 0n ? "≈ " + eth(proj, 6) + " ETH" : "-"}</b></div>
        <div><span>Multiplier on this bet</span><b class="mono">${mult ? mult.toFixed(2) + "×" : "-"}</b></div>
        <div><span>Estimated gas fee</span><b class="mono" id="gasEst">estimating…</b></div>
      </div>
      <button class="btn primary" style="width:100%;height:50px;margin-top:16px;font-size:16px" data-bet="${m.id}">${S.account ? `Place ${S.side ? "YES" : "NO"} bet` : "Connect wallet to bet"}</button>
      <p class="note">Payout is shared pro-rata among the winning side after 3% fees (2% platform + 1% creator). The estimate moves as other people bet.</p>`;
  }
  const mine = (m.myYes + m.myNo) > 0n ? `<div class="banner info" style="margin-top:14px">Your stake here: <b>${eth(m.myYes)} ETH on YES</b> · <b>${eth(m.myNo)} ETH on NO</b></div>` : "";
  const creator = (isCreator && !m.resolved) ? `
    <div class="creatorbox"><p><b>You created this market</b>, so you decide the outcome (a simulated oracle for this project). Resolve it once the real event is known.</p>
      <div class="sides"><button class="side-btn yes" data-resolve="yes" data-id="${m.id}">Resolve: YES</button><button class="side-btn no" data-resolve="no" data-id="${m.id}">Resolve: NO</button></div></div>` : "";
  return `<button class="x" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="mmeta" style="margin:0 0 10px">${statusBadge(m)}<span>Market #${m.id}</span><span>created by <a target="_blank" rel="noopener" href="${CFG.explorer}/address/${m.creator}">${isCreator ? "you" : short(m.creator)}</a></span></div>
    <h2>${esc(m.question)}</h2>
    <div class="bar"><i class="y" style="width:${yp}%"></i><i class="n" style="width:${np}%"></i></div>
    <div class="barlab"><span style="color:var(--yes)">YES ${t === 0n ? "50%" : fmtPct(yp)}</span><span style="color:var(--no)">NO ${t === 0n ? "50%" : fmtPct(np)}</span></div>
    <div class="stats"><div class="stat"><small>YES pool</small><b class="mono">${eth(m.yesPool, 5)} ETH</b></div><div class="stat"><small>NO pool</small><b class="mono">${eth(m.noPool, 5)} ETH</b></div><div class="stat"><small>Total pool</small><b class="mono">${eth(t, 5)} ETH</b></div></div>
    ${mine}${result}${betForm}${creator}`;
}

function renderModal(){
  if (S.modalKind === "create"){ return; }
  const m = S.markets.find(x => x.id === S.modalId);
  if (!m) return;
  const keepFocus = document.activeElement && document.activeElement.id === "amt";
  const pos = keepFocus ? document.activeElement.selectionStart : null;
  $("#modal").innerHTML = marketModalHtml(m);
  $("#overlay").classList.add("show");
  if (keepFocus){ const i = $("#amt"); i.focus(); try { i.setSelectionRange(pos, pos); } catch(e){} }
  updateGasEstimate(m);
}
let gasTimer = null;
function updateGasEstimate(m){
  const el = $("#gasEst"); if (!el) return;
  clearTimeout(gasTimer);
  gasTimer = setTimeout(async () => {
    try{
      const v = ethers.parseEther(S.amount || "0");
      if (v <= 0n) { el.textContent = "-"; return; }
      const from = S.account || undefined;
      const gas = from ? await S.readContract.bet.estimateGas(m.id, S.side, { value: v, from }) : 75000n;
      const fd = await S.reader.getFeeData();
      const price = fd.maxFeePerGas ?? fd.gasPrice ?? 0n;
      const fee = gas * price;
      const e2 = $("#gasEst"); if (e2) e2.textContent = `~${ethers.formatEther(fee).slice(0, 10)} ETH (${gas.toString()} gas${from ? "" : ", typical"})`;
    }catch(e){ const e2 = $("#gasEst"); if (e2) e2.textContent = "~75,000 gas (typical)"; }
  }, 250);
}
function openMarket(id, side){
  S.modalId = id; S.modalKind = "market";
  if (side) S.side = side === "yes";
  renderModal();
}
function openCreate(){
  S.modalKind = "create"; S.modalId = null;
  openModal(`<button class="x" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <h2>Create a market</h2>
    <p style="color:var(--muted);margin-top:8px">Write a clear YES/NO question. You become the creator: you decide the outcome later, and you earn 1% of the pool.</p>
    <div class="field"><label>Question</label><input class="input" id="newq" maxlength="140" placeholder="Will grading on a curve be eliminated for next term?"></div>
    <button class="btn primary" style="width:100%;height:50px;margin-top:18px;font-size:16px" data-create>Create market on Sepolia</button>
    <p class="note">This sends a transaction (gas fee in Sepolia ETH). After it confirms, share the new market number with your team.</p>`);
  setTimeout(() => $("#newq")?.focus(), 50);
}
function openHow(){
  S.modalKind = "how"; S.modalId = null;
  openModal(`<button class="x" data-close aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <h2>How Polybet works</h2>
    <div class="est" style="margin-top:18px;gap:14px">
      <div style="display:block"><b>1. Pick a side.</b><br><span>Every market is a YES/NO question. Bets from everyone go into a YES pool or a NO pool.</span></div>
      <div style="display:block"><b>2. The creator resolves it.</b><br><span>When the real event is known, the market creator reports the outcome (a simulated oracle; real systems use UMA or Chainlink).</span></div>
      <div style="display:block"><b>3. Winners share the pool.</b><br><span>After 3% fees (2% platform, 1% creator), the whole pool is split among the winning side in proportion to what each person bet. If nobody bet on the winning side, everyone is refunded.</span></div>
      <div style="display:block"><b>4. Every action is a transaction.</b><br><span>Betting, resolving and claiming cost a small gas fee. On Sepolia it is paid in free test ETH.</span></div>
    </div>`);
}

/* ============ EVENTS ============ */
document.addEventListener("click", e => {
  const t = e.target;
  const q = sel => t.closest(sel);
  if (q("[data-close]") || t === $("#overlay")) return closeModal();
  let el;
  if ((el = q("[data-claim]"))){ e.stopPropagation(); return doClaim(Number(el.dataset.claim)); }
  if ((el = q("[data-resolve]"))){ const yes = el.dataset.resolve === "yes"; if (confirm(`Resolve this market as ${yes ? "YES" : "NO"}? This cannot be undone.`)) doResolve(Number(el.dataset.id), yes); return; }
  if ((el = q("[data-bet]"))){ if (!S.account) return connectWallet(); return doBet(Number(el.dataset.bet), S.side, S.amount); }
  if ((el = q("[data-pick]"))){ S.side = el.dataset.pick === "yes"; return renderModal(); }
  if ((el = q("[data-amt]"))){ S.amount = el.dataset.amt; return renderModal(); }
  if (q("[data-create]")) return doCreate($("#newq").value);
  if ((el = q("[data-open]"))){ return openMarket(Number(el.dataset.open), el.dataset.side); }
  if ((el = q("[data-tab]"))){ S.tab = el.dataset.tab; if (S.tab === "activity") loadActivity().then(render); return render(); }
  if ((el = q("[data-actf]"))){ S.actFilter = el.dataset.actf; return render(); }
  if ((el = q("[data-tab-go]"))){ S.tab = el.dataset.tabGo; return render(); }
  if ((el = q("[data-filter]"))){ S.tab = "markets"; S.filter = el.dataset.filter; return render(); }
  if ((el = q("[data-act]"))){
    switch (el.dataset.act){
      case "connect": return connectWallet();
      case "withdraw": return doWithdraw();
      case "how": return openHow();
      case "retry": S.loading = true; render(); return initReader().then(() => refresh(true)).catch(err => { S.loading = false; S.loadError = errMsg(err); render(); });
      case "reload-activity": S.actBusy = null; S.activityError = null; render(); return loadActivity().then(render);
      case "create": return needWallet().then(ok => ok && openCreate());
      case "scroll": return $("#mkts")?.scrollIntoView({ behavior: "smooth" });
    }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "amt"){ S.amount = e.target.value.replace(",", "."); const m = S.markets.find(x => x.id === S.modalId); if (m) renderModal(); }
  if (e.target.id === "q"){ S.query = e.target.value; S.tab = "markets"; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#q").focus(); }
  if (e.key === "Enter" && e.target.id === "newq") doCreate(e.target.value);
});
$("#connect").addEventListener("click", () => { if (!S.account) connectWallet(); else { S.tab = "portfolio"; render(); } });
$("#newMarketBtn").addEventListener("click", async () => { if (await needWallet()) openCreate(); });

/* ============ BOOT ============ */
(async function boot(){
  $("#contractLink").href = `${CFG.explorer}/address/${CFG.address}`;
  actLoadCache(); actPublish();
  render();
  try{
    await initReader();
    bindWalletEvents();
    await trySilentConnect();
    await refresh(true);
    setInterval(() => { if (!document.hidden && !$("#overlay").classList.contains("show")) refresh(S.tab === 'activity', true); }, 20000);
  }catch(e){ S.loading = false; S.loadError = errMsg(e); render(); }
})();
</script>
</body>
</html>
